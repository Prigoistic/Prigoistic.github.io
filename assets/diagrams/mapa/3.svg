<svg width="100%" viewBox="0 0 720 492" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,sans-serif"><style>:root{--ink:#252521;--muted:#65655d;--indigo:#3c3489;--teal:#0a5a49;--coral:#9c3b1b;--amber:#9a6b12}text{font-family:Arial,sans-serif}.svg-lbl{font-size:13px;fill:#252521}.svg-sub{font-size:11px;fill:#65655d}.svg-h{font-size:14px;font-weight:600}</style><svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"></polygon>
    </marker>
    <marker id="arr-dk" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"></polygon>
    </marker>
  </defs>
</svg>


  <rect x="0" y="0" width="720" height="143" rx="0" fill="#f8fafc"></rect>
  <rect x="0" y="153" width="720" height="140" rx="0" fill="#dbeafe" opacity="0.35"></rect>
  <rect x="0" y="303" width="720" height="189" rx="0" fill="#dcfce7" opacity="0.35"></rect>


  <text x="10" y="12" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">EVERY STEP</text>
  <text x="10" y="164" font-size="9" font-weight="700" fill="#2563eb" letter-spacing="0.08em">WHEN PREDICTION ERROR EXCEEDS THRESHOLD</text>
  <text x="10" y="314" font-size="9" font-weight="700" fill="#16a34a" letter-spacing="0.08em">WHEN GATE FIRES — RARE</text>




  <rect x="8" y="20" width="96" height="108" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"></rect>
  <text x="56" y="56" text-anchor="middle" font-size="17" fill="#1e293b" font-weight="700">s_t</text>
  <text x="56" y="76" text-anchor="middle" font-size="10" fill="#64748b">Observation</text>
  <text x="56" y="90" text-anchor="middle" font-size="10" fill="#64748b">raw frame</text>
  <text x="56" y="118" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">every timestep</text>

  <line x1="104" y1="74" x2="122" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"></line>


  <rect x="124" y="20" width="130" height="108" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"></rect>
  <text x="189" y="39" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">Encoder φ</text>
  <line x1="124" y1="46" x2="254" y2="46" stroke="#a78bfa" stroke-width="1"></line>
  <text x="189" y="62" text-anchor="middle" font-size="10" fill="#4c1d95">Frozen — never updated</text>
  <text x="189" y="77" text-anchor="middle" font-size="10" fill="#4c1d95">s_t → z_t ∈ ℝ¹⁹²</text>
  <text x="189" y="93" text-anchor="middle" font-size="10" fill="#4c1d95">abstract representation</text>
  <text x="189" y="118" text-anchor="middle" font-size="8.5" fill="#7c3aed" font-style="italic">SIGReg-trained, metric-preserving</text>

  <line x1="254" y1="74" x2="272" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"></line>


  <rect x="274" y="20" width="154" height="108" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"></rect>
  <text x="351" y="39" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">z_t and ε_t</text>
  <line x1="274" y1="46" x2="428" y2="46" stroke="#e2e8f0" stroke-width="1"></line>
  <text x="351" y="62" text-anchor="middle" font-size="10" fill="#475569">z_t = φ(s_t)</text>
  <text x="351" y="77" text-anchor="middle" font-size="10" fill="#475569">ε_t = ‖ẑ_t − z_t‖²</text>
  <text x="351" y="92" text-anchor="middle" font-size="9.5" fill="#64748b">ẑ_t: predicted at t−1</text>
  <text x="351" y="107" text-anchor="middle" font-size="9.5" fill="#64748b">z_t: actual right now</text>

  <line x1="428" y1="74" x2="446" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"></line>


  <rect x="448" y="20" width="258" height="108" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"></rect>
  <text x="577" y="39" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Predictor f_θ + LoRA Δθ</text>
  <line x1="448" y1="46" x2="706" y2="46" stroke="#60a5fa" stroke-width="1"></line>
  <text x="577" y="62" text-anchor="middle" font-size="10" fill="#1e3a8a">inputs: z_t + nearest landmark</text>
  <text x="577" y="77" text-anchor="middle" font-size="10" fill="#1e3a8a">output: ẑ_{t+1} (stored for next step)</text>
  <text x="577" y="93" text-anchor="middle" font-size="9.5" fill="#3b82f6">LoRA adapter Δθ is updated when gate fires</text>
  <text x="577" y="118" text-anchor="middle" font-size="8.5" fill="#6b7280" font-style="italic">runs every step · uses landmark from C7</text>


  <path d="M351,128 L351,148 L83,148 L83,173" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arr)"></path>
  <text x="220" y="144" text-anchor="middle" font-size="9" fill="#92400e">ε_t if above threshold</text>




  <rect x="8" y="175" width="148" height="108" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"></rect>
  <text x="82" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">C2 Threshold</text>
  <line x1="8" y1="201" x2="156" y2="201" stroke="#fcd34d" stroke-width="1"></line>
  <text x="82" y="217" text-anchor="middle" font-size="10" fill="#78350f">τ(t) = μ_W + 2σ_W</text>
  <text x="82" y="231" text-anchor="middle" font-size="9.5" fill="#78350f">100-step rolling window</text>
  <text x="82" y="248" text-anchor="middle" font-size="9.5" fill="#92400e">ε_t &gt; τ → write to buffer</text>
  <text x="82" y="263" text-anchor="middle" font-size="9.5" fill="#a16207">ε_t ≤ τ → discard</text>
  <text x="82" y="276" text-anchor="middle" font-size="8.5" fill="#a16207" font-style="italic">adapts as predictor improves</text>

  <line x1="156" y1="229" x2="172" y2="229" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"></line>


  <rect x="174" y="175" width="174" height="108" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"></rect>
  <text x="261" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">C3 Episodic Buffer</text>
  <line x1="174" y1="201" x2="348" y2="201" stroke="#60a5fa" stroke-width="1"></line>
  <text x="261" y="217" text-anchor="middle" font-size="10" fill="#1e3a8a">2048 entries · ~7.5MB</text>
  <text x="261" y="232" text-anchor="middle" font-size="9.5" fill="#1e3a8a">(z_t, a_t, z_{t+1}, ε_t, ep_id)</text>
  <text x="261" y="248" text-anchor="middle" font-size="9.5" fill="#1e3a8a">surprise-weighted LRU eviction</text>
  <text x="261" y="276" text-anchor="middle" font-size="8.5" fill="#3b82f6" font-style="italic">fast buffer — hippocampus analogue</text>

  <line x1="348" y1="229" x2="364" y2="229" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"></line>


  <rect x="366" y="175" width="202" height="108" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"></rect>
  <text x="467" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">C4 Online K-Means</text>
  <line x1="366" y1="201" x2="568" y2="201" stroke="#4ade80" stroke-width="1"></line>
  <text x="467" y="217" text-anchor="middle" font-size="10" fill="#14532d">groups z_t by cosine similarity</text>
  <text x="467" y="232" text-anchor="middle" font-size="9.5" fill="#14532d">tight cluster → real change</text>
  <text x="467" y="247" text-anchor="middle" font-size="9.5" fill="#14532d">scattered → noise</text>
  <text x="467" y="263" text-anchor="middle" font-size="9.5" fill="#14532d">EMA centroids track slow drift</text>
  <text x="467" y="276" text-anchor="middle" font-size="8.5" fill="#15803d" font-style="italic">β=0.95 · ~20 step memory per centroid</text>


  <path d="M467,283 L467,299 L278,299 L278,323" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"></path>
  <text x="375" y="296" text-anchor="middle" font-size="9" fill="#64748b">check gate criteria</text>




  <rect x="8" y="325" width="548" height="82" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"></rect>
  <text x="282" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">C5 Consolidation Gate — all three must hold</text>
  <line x1="8" y1="351" x2="556" y2="351" stroke="#f59e0b" stroke-width="1"></line>
  <text x="282" y="367" text-anchor="middle" font-size="10.5" fill="#78350f">① support(k) ≥ N_min · enough observations in this cluster, not a one-off fluke</text>
  <text x="282" y="382" text-anchor="middle" font-size="10.5" fill="#78350f">② tightness(k) ≤ σ²_max · cluster is geometrically tight = real change, not scattered noise</text>
  <text x="282" y="397" text-anchor="middle" font-size="10.5" fill="#78350f">③ novelty(k) ≥ δ_novel · centroid is far from existing landmarks = genuinely new</text>


  <path d="M160,407 L160,418 L124,418 L124,426" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"></path>
  <path d="M404,407 L404,418 L580,418 L580,426" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"></path>
  <text x="282" y="415" text-anchor="middle" font-size="8.5" fill="#9ca3af" font-style="italic">gate fires</text>


  <rect x="8" y="428" width="232" height="58" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"></rect>
  <text x="124" y="447" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">C6 LoRA Update</text>
  <line x1="8" y1="454" x2="240" y2="454" stroke="#a78bfa" stroke-width="1"></line>
  <text x="124" y="468" text-anchor="middle" font-size="10" fill="#4c1d95">32 entries · 20 Adam steps · lr=1e-4</text>
  <text x="124" y="480" text-anchor="middle" font-size="9.5" fill="#6d28d9">nudges predictor to new scene dynamics</text>


  <rect x="464" y="428" width="242" height="58" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"></rect>
  <text x="585" y="447" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">C7 Landmark Set</text>
  <line x1="464" y1="454" x2="706" y2="454" stroke="#4ade80" stroke-width="1"></line>
  <text x="585" y="468" text-anchor="middle" font-size="10" fill="#14532d">192-dim centroid · permanent · kilobytes</text>
  <text x="585" y="480" text-anchor="middle" font-size="9.5" fill="#15803d">retrieved every step → anchors predictor</text>


  <path d="M706,457 L712,457 L712,74 L706,74" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"></path>
  <text x="715" y="305" font-size="8.5" fill="#4ade80" transform="rotate(90,715,305)" text-anchor="middle">retrieved every step</text>

</svg>

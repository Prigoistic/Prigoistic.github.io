  <rect x="8" y="72" width="664" height="72" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"></rect>
  <text x="340" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Stage 1 · SIGReg Encoder Pre-training</text>
  <line x1="8" y1="100" x2="672" y2="100" stroke="#a78bfa" stroke-width="1"></line>
  <text x="340" y="116" text-anchor="middle" font-size="11" fill="#4c1d95">L = L_InfoNCE + λ_geo · L_geo  ·  metric-preserving latent space</text>
  <text x="340" y="132" text-anchor="middle" font-size="11" fill="#4c1d95">No EMA target network · halves trainable params · bounds encoder Lipschitz constant</text>

  <line x1="340" y1="144" x2="340" y2="166" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"></line>



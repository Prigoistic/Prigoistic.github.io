  <line x1="8" y1="198" x2="672" y2="198" stroke="#60a5fa" stroke-width="1"></line>
  <text x="340" y="214" text-anchor="middle" font-size="11" fill="#1e3a8a">Multi-step targets k ∈ {1,2,4,8,16}  ·  L_JEPA = ||f_θ(z_t,k) − sg[φ(s_{t+k})]||²</text>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#1e3a8a">Representations meaningful at multiple timescales · aligns with MAPA fast/slow memory split</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-label="A belief contains a memory of a giving event."><style>text{font-family:Arial,sans-serif;fill:#29332f;font-size:15px}.small{font-size:12px;fill:#65655d}</style><rect width="360" height="410" fill="#f3eddf"/><rect x="12" y="14" width="336" height="355" rx="3" fill="#e9e0cd" stroke="#b4ad9d"/><text x="28" y="44">Dave believes…</text><rect x="28" y="69" width="304" height="278" rx="3" fill="#e0e4d8" stroke="#7d8877"/><text x="44" y="101">Carol remembers…</text><rect x="44" y="126" width="272" height="200" rx="3" fill="#f8f4eb" stroke="#aa5038"/><text x="60" y="159">Alice gave Bob a book</text><circle cx="92" cy="221" r="24" fill="#e9e0cd" stroke="#b4ad9d"/><text x="92" y="226" text-anchor="middle">Alice</text><text x="92" y="280" text-anchor="middle" class="small">giver</text><circle cx="180" cy="221" r="24" fill="#e9e0cd" stroke="#b4ad9d"/><text x="180" y="226" text-anchor="middle">Bob</text><text x="180" y="280" text-anchor="middle" class="small">recipient</text><circle cx="268" cy="221" r="24" fill="#e9e0cd" stroke="#b4ad9d"/><text x="268" y="226" text-anchor="middle">Book</text><text x="268" y="280" text-anchor="middle" class="small">object</text><text x="180" y="395" text-anchor="middle" class="small">Each relation preserves its own scope.</text></svg>

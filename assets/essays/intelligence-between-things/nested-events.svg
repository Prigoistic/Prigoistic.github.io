<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Dave believes that Carol remembers an event: Alice as giver, Bob as recipient and a book as object. The belief does not establish the event as fact."><rect width="720" height="420" fill="#f3eddf"/><style>text{font-family:Arial,sans-serif;fill:#29332f;font-size:17px}.small{font-size:13px;fill:#65655d}.label{font-size:15px}</style><rect x="22" y="20" width="676" height="340" rx="3" fill="#e9e0cd" stroke="#b4ad9d"/><text x="46" y="53">Dave believes…</text><rect x="45" y="78" width="630" height="258" rx="3" fill="#e0e4d8" stroke="#7d8877"/><text x="68" y="113">Carol remembers…</text><rect x="68" y="139" width="584" height="172" rx="3" fill="#f8f4eb" stroke="#aa5038"/><text x="92" y="174">Alice gave Bob a book</text><circle cx="172" cy="226" r="27" fill="#e9e0cd" stroke="#b4ad9d"/><text x="172" y="232" text-anchor="middle" class="label">Alice</text><text x="172" y="282" text-anchor="middle" class="small">giver</text><circle cx="360" cy="226" r="27" fill="#e9e0cd" stroke="#b4ad9d"/><text x="360" y="232" text-anchor="middle" class="label">Bob</text><text x="360" y="282" text-anchor="middle" class="small">recipient</text><circle cx="548" cy="226" r="27" fill="#e9e0cd" stroke="#b4ad9d"/><text x="548" y="232" text-anchor="middle" class="label">Book</text><text x="548" y="282" text-anchor="middle" class="small">object</text><text x="360" y="391" text-anchor="middle" class="small">Each outer relation refers to the event or relation inside it.</text></svg>
